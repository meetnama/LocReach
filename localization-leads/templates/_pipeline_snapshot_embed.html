{% extends '_embed_base.html' %}
{% block title %}Pipeline{% endblock %}

{% block body %}
<div class="grid grid-cols-3 gap-3">
  <div class="rounded-xl border border-slate-800 bg-slate-950/60 px-4 py-4 text-center cursor-default">
    <div class="text-2xl font-bold text-white">{{ qualified }}</div>
    <div class="mt-1 text-xs font-semibold uppercase tracking-wide text-white">Qualified Domains</div>
    <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-800">
      <div class="h-full rounded-full bg-qualified-500" style="width: 100%"></div>
    </div>
  </div>

  <div class="rounded-xl border border-slate-800 bg-slate-950/60 px-4 py-4 text-center cursor-default">
    <div class="text-2xl font-bold text-white">{{ people_total }}</div>
    <div class="mt-1 text-xs font-semibold uppercase tracking-wide text-white">People Found</div>
    <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-800">
      <div class="h-full rounded-full bg-signal-500" style="width: {{ people_pct }}%"></div>
    </div>
    <div class="mt-1.5 text-xs text-white/80">{{ people_done }} searched · {{ people_todo }} queued</div>
  </div>

  <div class="rounded-xl border border-slate-800 bg-slate-950/60 px-4 py-4 text-center cursor-default">
    <div class="text-2xl font-bold text-white">{{ leads }}</div>
    <div class="mt-1 text-xs font-semibold uppercase tracking-wide text-white">Verified Leads</div>
    <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-800">
      <div class="h-full rounded-full bg-reach-500" style="width: {{ leads_pct }}%"></div>
    </div>
    <div class="mt-1.5 text-xs text-white/80">{{ conversion }}% of people converted</div>
  </div>
</div>
{% endblock %}
